[package]
name = "tally"
version = "0.2.0"
description = "Your AI coding tokens, right next to the clock."
authors = ["Erwan <@ErwanCodes>"]
license = "MIT"
repository = "https://github.com/erwancodes/tally"
edition = "2021"

[lib]
name = "tally_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
notify-debouncer-mini = "0.4"
walkdir = "2"
dirs = "5"
parking_lot = "0.12"
window-vibrancy = "0.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
